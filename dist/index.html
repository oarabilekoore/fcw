    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.ts)
      try {
        var t = JSON.parse(localStorage.getItem('fcw.theme') || '{}');
        var dark = t.mode === 'dark' || ((t.mode || 'system') === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var c = t.contrast || 'auto';
        if (c === 'auto') c = matchMedia('(prefers-contrast: more)').matches ? 'high' : 'standard';
        var h = document.documentElement;
        h.className = (dark ? 'dark' : 'light') + (c === 'high' ? '-high-contrast' : c === 'medium' ? '-medium-contrast' : '');
      } catch (e) {}
    </script>
